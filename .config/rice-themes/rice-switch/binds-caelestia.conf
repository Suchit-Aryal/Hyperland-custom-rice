# binds-caelestia.conf — active while the caelestia-shell rice is running
# Window/workspace binds stay from Keybinds.conf; only shell keys are remapped here

bindd = SUPER SHIFT, T, cycle rice (kool -> end4 -> caelestia), exec, ~/.config/rice-themes/rice-switch/rice-switch.sh toggle

# Caelestia shell IPC. NOTE: we run a fixed local fork, whose socket the stock
# `caelestia-shell ipc` CLI can't find, so all calls go through the wrapper
# script (resolves the live shell PID and talks to it directly).
# SUPER+W -> open caelestia launcher in wallpaper mode (the real wallpaper picker;
# nexus open would just open the settings window)
unbind = SUPER, W
bindd = SUPER, W, open launcher, exec, ~/.config/rice-themes/rice-switch/caelestia-ipc.sh call drawers toggle launcher

# Remove kool's SUPER+S google web search while in caelestia mode (caelestia's own
# launcher handles search instead) -> rebind SUPER+S to open caelestia settings (nexus)
unbind = SUPER, S
bindd = SUPER, S, settings (caelestia), exec, ~/.config/rice-themes/rice-switch/caelestia-ipc.sh call nexus open

# Launcher (kool does not bind SUPER D, but keep it consistent with end4)
unbind = SUPER, D
bindd = SUPER, D, app launcher (caelestia), exec, ~/.config/rice-themes/rice-switch/caelestia-ipc.sh call drawers toggle launcher

# Desktop overview -> caelestia dashboard
unbind = SUPER, A
bindd = SUPER, A, desktop overview (caelestia), exec, ~/.config/rice-themes/rice-switch/caelestia-ipc.sh call drawers toggle dashboard

# Notification key -> toggle do-not-disturb (caelestia shows its own notifs; swaync is not running)
unbind = SUPER SHIFT, N
bindd = SUPER SHIFT, N, toggle notifications dnd (caelestia), exec, ~/.config/rice-themes/rice-switch/caelestia-ipc.sh call notifs toggleDnd
