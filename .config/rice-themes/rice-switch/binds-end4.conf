# binds-end4.conf — active while the end4-pC (quickshell) rice is running
# Window/workspace binds stay from Keybinds.conf; only shell keys are remapped here

bindd = SUPER SHIFT, T, cycle rice (kool -> end4), exec, ~/.config/rice-themes/rice-switch/rice-switch.sh toggle

# end4-pC shell (quickshell IPC)
# Override kool rofi wallpaper picker (Keybinds.conf $mainMod W) with end4's native selector
unbind = SUPER, W
bindd = SUPER, W, wallpaper selector (end4), exec, ~/.nix-profile/bin/qs -c end4-pC ipc call wallpaperSelector toggle
bindd = SUPER SHIFT, N, notification center (end4), exec, ~/.nix-profile/bin/qs -c end4-pC ipc call sidebarRight toggle
bindd = SUPER, D, app launcher (end4), exec, ~/.nix-profile/bin/qs -c end4-pC ipc call search toggle
bindd = SUPER, A, desktop overview (end4), exec, ~/.nix-profile/bin/qs -c end4-pC ipc call sidebarLeft toggle