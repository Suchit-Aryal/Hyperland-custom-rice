# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules
# This file will not be modified during dotfiles updates

# Spotify → workspace 2
windowrule = match:class ^(spotify)$, workspace 2 silent

# Wifi popup
windowrule = match:class ^(com.hypr.wifipopup)$, float on
windowrule = match:class ^(com.hypr.wifipopup)$, move 800 40

# Sound popup
windowrule = match:class ^(com.hypr.soundpopup)$, float on
windowrule = match:class ^(com.hypr.soundpopup)$, move 800 40

# Bluetooth popup
windowrule = match:class ^(com.hypr.btpopup)$, float on
windowrule = match:class ^(com.hypr.btpopup)$, move 800 40

# Layer rules (blur behind translucent panels: swaync CC, popups, wlogout)
layerrule = match:namespace swaync, blur on
layerrule = match:namespace swaync, ignore_alpha 0.5
layerrule = match:namespace notifications, blur on
layerrule = match:namespace notifications, ignore_alpha 0.5
layerrule = match:namespace gtk-layer-shell, blur on
